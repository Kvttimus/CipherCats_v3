# Render Blueprint for the CipherCats Flask API.
# Render dashboard -> New -> Blueprint -> pick this repo. Fill in the secret env vars when prompted.
services:
  - type: web
    name: ciphercats-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --timeout 30 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # e.g. https://ciphercats.vercel.app
      - key: SANDBOX_URL
        sync: false
      - key: SANDBOX_TOKEN
        sync: false
